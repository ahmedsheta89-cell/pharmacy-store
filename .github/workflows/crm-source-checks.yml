name: CRM source checks (no deploy)
on:
  pull_request:
  push:
    branches: [review/crm-foundation]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:crm
      - run: pnpm build
      - run: pnpm --dir crm install --frozen-lockfile
      - run: pnpm build:crm
      - run: python3 -m unittest test_export_crm.py
        working-directory: archive
      - run: npm ci --ignore-scripts
        working-directory: testing
      - run: testing/node_modules/.bin/firebase emulators:exec --config firebase.testing.json --project demo-crm-check --only firestore 'node --test testing/rules.test.mjs'
